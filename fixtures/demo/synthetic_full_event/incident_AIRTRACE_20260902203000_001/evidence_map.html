<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AirTrace Source Evidence Fusion v1</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui,sans-serif;color:#172033}header{padding:12px 18px;border-bottom:1px solid #d9e0ea;background:#fff}h1{margin:0 0 4px;font-size:20px}.note{color:#586579;font-size:13px}#map{height:calc(100vh - 92px);min-height:560px}</style></head><body><header><h1>AirTrace Source Evidence Fusion v1</h1><div class="note">DETECTED EVENT TRACE · scores are relative evidence, not probability or attribution · CEMS is supporting context only</div></header><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const ctx={"south":25.0,"north":25.12,"west":121.4,"east":121.52},core={"south":25.05,"north":25.086,"west":121.428,"east":121.474},grid=[{"cell_key":[-5,-1],"center_lat":25.058869,"center_lon":121.448844,"total_density":1.0,"normalized_density":1.0,"receptor_support_count":1,"receptor_support_fraction":0.5,"contributing_times_utc":["2026-09-02T20:28:00Z","2026-09-02T20:29:00Z"],"source_evidence_score":1.0},{"cell_key":[-5,0],"center_lat":25.061131,"center_lon":121.448844,"total_density":1.0,"normalized_density":1.0,"receptor_support_count":1,"receptor_support_fraction":0.5,"contributing_times_utc":["2026-09-02T20:28:00Z","2026-09-02T20:29:00Z"],"source_evidence_score":1.0}],trajs=[{"receptor_index":0,"station_id":"a0","particle_index":0,"termination_reason":"time_limit","residual_sources_by_correlation_block":["none"],"points":[{"lat":25.06,"lon":121.45,"time_utc":"2026-09-02T20:30:00Z"},{"lat":25.06,"lon":121.449405,"time_utc":"2026-09-02T20:29:00Z"},{"lat":25.06,"lon":121.44881,"time_utc":"2026-09-02T20:28:00Z"}]},{"receptor_index":1,"station_id":"a1","particle_index":0,"termination_reason":"time_limit","residual_sources_by_correlation_block":["none"],"points":[{"lat":25.0602,"lon":121.4502,"time_utc":"2026-09-02T20:30:00Z"},{"lat":25.0602,"lon":121.449605,"time_utc":"2026-09-02T20:29:00Z"},{"lat":25.0602,"lon":121.44901,"time_utc":"2026-09-02T20:28:00Z"}]}],seeds=[{"station_id":"a0","seed_time_utc":"2026-09-02T20:30:00Z","lat":25.06,"lon":121.45,"pm25":30.0,"anomaly_score":7.0,"temporal_excess":null,"spatial_excess":null,"role":"seed","normalized_weight":0.506849315},{"station_id":"a1","seed_time_utc":"2026-09-02T20:30:00Z","lat":25.0602,"lon":121.4502,"pm25":30.0,"anomaly_score":6.0,"temporal_excess":null,"spatial_excess":null,"role":"seed","normalized_weight":0.493150685}],regions=[{"rank":1,"candidate_source_region":true,"centroid":{"lat":25.06,"lon":121.448844},"area_km2":0.125,"peak_score":1.0,"mean_score":1.0,"receptor_support_count":1,"receptor_support_fraction":0.5,"distance_to_event_centroid_km":0.127002,"contributing_time_range_utc":{"start":"2026-09-02T20:28:00Z","end":"2026-09-02T20:29:00Z"},"bounds":{"south":25.057738,"north":25.062262,"west":121.447721,"east":121.449967},"cell_count":2}],facilities=[],fires=[];const map=L.map('map',{preferCanvas:true}).setView([25.06,121.47],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);L.rectangle([[ctx.south,ctx.west],[ctx.north,ctx.east]],{color:'#26364f',weight:2,fill:false,dashArray:'7 5'}).bindPopup('Context Zone').addTo(map);L.rectangle([[core.south,core.west],[core.north,core.east]],{color:'#8e2a86',weight:3,fill:false,dashArray:'8 4'}).bindPopup('Core Zone').addTo(map);const max=Math.max(1,...grid.map(x=>x.source_evidence_score||0));grid.forEach(x=>{const score=x.source_evidence_score||0;const color='hsl('+(230-210*score/max)+',85%,50%)';L.circle([x.center_lat,x.center_lon],{radius:125,color,fillColor:color,fillOpacity:.2+.6*score/max,weight:0}).bindPopup('Relative source evidence: '+score.toFixed(3)+'<br>Receptor support: '+x.receptor_support_count).addTo(map)});trajs.forEach(t=>L.polyline((t.points||[]).map(p=>[p.lat,p.lon]),{color:'#64748b',weight:1,opacity:.18}).addTo(map));seeds.forEach(s=>L.circleMarker([s.lat,s.lon],{radius:6,color:'#d97706',fillColor:'#fbbf24',fillOpacity:.9}).bindPopup('Receptor '+s.station_id).addTo(map));regions.forEach(r=>L.circleMarker([r.centroid.lat,r.centroid.lon],{radius:10,color:'#b91c1c',fill:false,weight:3}).bindPopup('Candidate source region #'+r.rank+'<br>Relative peak score: '+r.peak_score.toFixed(3)).addTo(map));facilities.forEach(f=>L.circleMarker([f.lat,f.lon],{radius:Math.max(5,10*f.evidence_score),color:'#2563eb',fillColor:'#60a5fa',fillOpacity:.75}).bindPopup('<b>FACILITY #'+f.rank+'</b><br>'+String(f.name||'')+'<br>EmsNo: '+String(f.ems_no||'')+'<br>Industry: '+String(f.industry||'')+'<br>Air regulated: '+String(f.is_air_regulated)+'<br>Point/local max/local mean: '+f.point_score.toFixed(3)+' / '+f.local_max_score.toFixed(3)+' / '+f.local_mean_score.toFixed(3)+'<br>CEMS available: '+String(f.cems_available)+'<br>Relative evidence: '+f.evidence_score.toFixed(3)).addTo(map));fires.forEach(f=>L.circleMarker([f.lat,f.lon],{radius:Math.max(5,10*f.evidence_score),color:'#ea580c',fillColor:'#fb923c',fillOpacity:.75}).bindPopup('<b>FIRE_HOTSPOT #'+f.rank+'</b><br>Group: '+String(f.fire_group_id)+'<br>Acquisition: '+String(f.first_acquisition_time_utc)+' — '+String(f.last_acquisition_time_utc)+'<br>Satellites: '+String((f.satellites||[]).join(', '))+'<br>Detections: '+f.detection_count+'<br>Confidence: '+String((f.confidence||[]).join(', '))+'<br>FRP (descriptive): '+String(f.max_frp)+'<br>Relative evidence: '+f.evidence_score.toFixed(3)).addTo(map));map.fitBounds([[ctx.south,ctx.west],[ctx.north,ctx.east]],{padding:[12,12]});</script></body></html>
